<!DOCTYPE html>
<html>
<head>
    <title>My Bookings</title>
</head>
<body>

<h2>My Booked Appointments</h2>

<table border="1">
<tr>
    <th>Doctor</th>
    <th>Date</th>
    <th>Start Time</th>
    <th>End Time</th>
</tr>

{% for booking in bookings %}
<tr>
    <td>{{ booking.slot.doctor.username }}</td>
    <td>{{ booking.slot.date }}</td>
    <td>{{ booking.slot.start_time }}</td>
    <td>{{ booking.slot.end_time }}</td>
</tr>
{% empty %}
<tr>
    <td colspan="4">No bookings yet</td>
</tr>
{% endfor %}

</table>

<br>

<a href="/doctors/">Book another appointment</a>

</body>
</html>
